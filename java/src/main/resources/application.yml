server:
  port: 8089
  tomcat:
    apr:
      enabled: false

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/canteen_recommendation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl.schema_management_tool: hibernate
        schema_management_tool.strip_definitions_before_export: true
        hbm2ddl.auto: update

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

jwt:
  secret: ${JWT_SECRET:replace-with-strong-jwt-secret-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:86400000}

payment:
  callback-secret: ${PAYMENT_CALLBACK_SECRET:}
  callback-timeout-seconds: ${PAYMENT_CALLBACK_TIMEOUT_SECONDS:300}

file:
  # 默认使用本项目下的 uploads；也可通过环境变量 FILE_UPLOAD_DIR 覆盖
  upload-dir: ${FILE_UPLOAD_DIR:C:\Users\ASUS\Desktop\毕业设计\论文\canteen_recommendation_3.0\canteen_recommendation_3.0\java\uploads}

reset:
  dish:
    ids: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: ERROR
    com.school.canteen: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
