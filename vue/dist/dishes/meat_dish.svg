  <rect x="98" y="78" width="15" height="15" rx="3" fill="#a84848" stroke="#6d2828" stroke-width="1"/>
  <rect x="116" y="82" width="15" height="15" rx="3" fill="#a84848" stroke="#6d2828" stroke-width="1"/>
  <rect x="85" y="98" width="15" height="15" rx="3" fill="#a84848" stroke="#6d2828" stroke-width="1"/>
  <rect x="105" y="100" width="15" height="15" rx="3" fill="#a84848" stroke="#6d2828" stroke-width="1"/>
  <!-- 光泽 -->
  <path d="M90,85 C100,80 110,80 120,85" stroke="#c65e5e" stroke-width="2" fill="none"/>
  <!-- 装饰蔬菜 -->
  <circle cx="130" cy="70" r="5" fill="#4caf50"/>
